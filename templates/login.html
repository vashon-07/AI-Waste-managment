<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI WasteWatch</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>
        <a href="/" class="logo-link"><div class="logo">♻️ AI WasteWatch</div></a>

        <nav>
            <a href="/">Home</a>
            <a href="/report">Report Waste</a>
            <a href="/login" class="active login-nav-btn">Login</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">🔐</div>

            <h1>Welcome to <span>AI WasteWatch</span></h1>
            <p class="login-subtitle">Sign in to manage reports and track cleanup priorities</p>

            {% if message %}
            <div class="login-alert">
                {{ message }}
            </div>
            {% endif %}

            <form class="login-form" action="/login" method="POST">

                <div class="input-group">
                    <label for="role">Account Type</label>
                    <select id="role" name="role" required>
                        <option value="citizen">Citizen Reporter</option>
                        <option value="officer">Municipal Officer</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="email">Email or Mobile</label>
                    <input type="text" id="email" name="email" placeholder="name@example.com or 10-digit number" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn">Sign In</button>

            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="/report">Report as Guest</a> or <a href="/">Back to Home</a></p>
            </div>

        </div>

    </main>

</body>
</html>
